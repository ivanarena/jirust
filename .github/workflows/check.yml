name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: ubuntu-latest
            rust: '1.90.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action revision
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.rust }}
      - if: matrix.rust == 'stable'
        run: make check
      - if: matrix.rust != 'stable'
        run: cargo test --locked && cargo check --locked --all-targets
      - run: make build
      - run: bin/jirust --demo --read-only --no-cache --no-copy-on-click --check
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Secret scans (verified pinned release; no application credentials)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts=--all
          mkdir "$RUNNER_TEMP/committed-source"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/committed-source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/committed-source" --redact=100
      - name: Dependency audit (including maintenance warnings)
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - name: Check third-party notices and source inventory
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo fetch --locked
          make notices-check
