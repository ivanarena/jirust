name: Refresh dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
# This workflow only proposes changes; it never merges or publishes releases.
permissions:
  contents: read
concurrency:
  group: dependency-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install notice generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Refresh lockfile and inventories, propose changes, run CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch=automation/dependencies
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch --create "$branch" --track "origin/$branch"
            # Preserve review commits and history. Conflicts require owner review,
            # never a force-push or silently discarded changes.
            git merge --no-edit "origin/$BASE_BRANCH"
          else
            git switch --create "$branch"
          fi
          cargo update --config 'resolver.incompatible-rust-versions="fallback"'
          cargo fetch --locked
          make notices
          make notices-check
          files=(Cargo.lock THIRD_PARTY_NOTICES.md THIRD_PARTY_SOURCES.json)
          if git diff --quiet "origin/$BASE_BRANCH" -- "${files[@]}"; then
            echo 'Dependencies and inventories are already current.'
            exit 0
          fi
          if ! git diff --quiet HEAD -- "${files[@]}"; then
            git add -- "${files[@]}"
            git commit -m 'Refresh compatible dependencies and third-party inventories'
          fi
          git push --set-upstream origin "$branch"
          # GITHUB_TOKEN pushes/PRs do not trigger push/pull_request workflows.
          # workflow_dispatch is the supported exception: run the entire native,
          # minimum-Rust and security matrix even if repository policy blocks PR creation.
          gh workflow run check.yml --ref "$branch"
          pr=$(gh pr list --base "$BASE_BRANCH" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            gh pr create --base "$BASE_BRANCH" --head "$branch" \
              --title 'Refresh compatible dependencies and third-party inventories' \
              --body 'Daily compatible Cargo updates, including transitive dependencies, with regenerated license notices and source inventory. Full Check CI is explicitly dispatched for this branch. Review and merge manually; security and minimum-Rust checks remain required.'
          fi
